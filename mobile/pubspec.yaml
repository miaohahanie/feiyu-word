name: word_pet_mobile
description: 单词桌宠手机端（Android）—— 局域网同步 + 离线复习
publish_to: 'none'
version: 0.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 局域网 HTTP 同步
  http: ^1.2.0
  # 本地 SQLite 词库
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  # 轻量状态管理
  provider: ^6.1.2
  # 二维码扫码配对
  mobile_scanner: ^5.2.3
  # 事件/设备 ID
  uuid: ^4.4.0
  # 日期格式化
  intl: ^0.19.0
  # 本地通知（每 2 小时复习提醒）
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
